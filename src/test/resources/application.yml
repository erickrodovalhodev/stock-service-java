# Testes rodam em H2 (modo PostgreSQL), sem Docker. Flyway aplica a mesma V1 e o
# Hibernate valida o schema contra a entidade, como em produção.
spring:
  datasource:
    url: jdbc:h2:mem:estoque;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
